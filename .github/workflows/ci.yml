name: CI

# サードパーティの Action はすべてコミット SHA で固定する（タグの付け替えによるサプライチェーン攻撃を防ぐ）。
# 更新は Dependabot（.github/dependabot.yml）が PR で行う。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ruleset の必須チェックに指定するジョブ。go.mod がまだ無い間は検査をスキップして成功させる。
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Go module
        id: detect
        run: |
          if [[ -f go.mod ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::go.mod が無いため Go の検査をスキップします"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.detect.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true

      # Ebitengine のビルド・テストに必要な X11 / OpenGL / ALSA の開発パッケージ
      - name: Install Ebitengine dependencies
        if: steps.detect.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb

      - name: Build
        if: steps.detect.outputs.go == 'true'
        run: go build ./...

      # gosec（SAST）も golangci-lint の中で実行する（.golangci.yml）
      - name: Lint
        if: steps.detect.outputs.go == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # go.mod の Go バージョンより古い Go でビルドされた golangci-lint は動かない。
          # go.mod の Go を上げたときは、このバージョンも上げること（Dependabot は更新しない）
          version: v2.15.0

      - name: Test
        if: steps.detect.outputs.go == 'true'
        run: xvfb-run --auto-servernum go test -race ./...
