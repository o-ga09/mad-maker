name: merge-gate

# マージゲートの 4 条件を判定する。判定ロジックは scripts/merge-gate.sh。
# 当面は ready-to-merge コメントを残すだけで、マージは人間が行う。
# 自動マージに切り替えるときは、リポジトリ変数 AUTO_MERGE_ENABLED を true にする（docs/setup.md 参照）。
#
# pull_request_target / workflow_run は base ブランチのコードで動く。PR のコードはチェックアウト・実行しない。
on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  gate:
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: merge-gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Evaluate gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          REQUIRED_CHECKS: ${{ vars.REQUIRED_CHECKS || 'ci' }}
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED || 'false' }}
          ROUTINE_URL: ${{ secrets.ROUTINE_FIX_URL }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_FIX_TOKEN }}
        run: scripts/merge-gate.sh
