# コミット SHA で固定した Actions と Go の依存を、週 1 回まとめて更新する。
# Dependabot の PR は .github/ や go.mod を変更するため、人間が確認してマージする（エージェントは触らない）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
